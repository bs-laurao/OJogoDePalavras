name: Testes

on:
  - push
  - pull_request

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Executar testes automatizados
        run: npm test
